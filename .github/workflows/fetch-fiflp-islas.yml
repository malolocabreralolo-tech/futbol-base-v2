name: Scrape FIFLP islas (Lanzarote / Fuerteventura, temporadas anteriores)

on:
  workflow_dispatch:
    inputs:
      temporada:
        description: 'Tanda: 17/18/19 (islas), 17gc/18gc/19gc (Gran Canaria), 20 (copas Cabildo LZ), 22 (2026-27 benjamín y prebenjamín), 22al (2026-27 alevín de Gran Canaria)'
        required: true
        default: '19'
      ids:
        description: 'IDs de competicion separados por coma (vacio = todas)'
        required: false
        default: ''

permissions:
  contents: write

# Las descargas manuales no se pisan entre sí; no hacen cola con el bot porque no escriben la base y rebasan antes de subir.
concurrency:
  group: descargas-manuales
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps
      # Las ligas de Gran Canaria son mucho mas grandes que las insulares
      # (12-14 grupos x ~26 jornadas con delay de 2-3s), asi que el limite de
      # 30 min que valia para las islas se queda corto.
      - name: Scrape ligas y copas insulares
        env:
          ISLAS_SEASON: ${{ inputs.temporada }}
          SCRAPE_IDS: ${{ inputs.ids }}
        run: python3 scripts/fetch_fiflp_islas.py
        timeout-minutes: 170
      # Sonda: solo commitea el raw JSON; NO toca la DB ni publica. El import,
      # la verificacion y la publicacion se hacen en LOCAL contra estos datos.
      # if: always() -> si el scrape se corta a medias, el raw parcial se sube
      # igual y el siguiente dispatch reanuda desde ahi (el scraper hace resume
      # por grupo). Antes, un timeout tiraba a la basura todo lo scrapeado.
      - name: Commit raw JSON
        if: always()
        env:
          ISLAS_SEASON: ${{ inputs.temporada }}
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          RAW="scripts/fiflp_islas_${ISLAS_SEASON}_raw.json"
          if [ ! -f "$RAW" ]; then
            echo "Sin datos: FIFLP no devolvio nada para esa tanda."
            exit 0
          fi
          git add "$RAW"
          if git diff --cached --quiet; then
            echo "El raw no ha cambiado; nada que subir."
            exit 0
          fi
          git commit -m "scrape: FIFLP islas tanda ${ISLAS_SEASON} raw (sonda)"
          # Como el bot (update.yml): si alguien ha subido a main entretanto, se rebasa y se reintenta, en vez
          # de perder la descarga entera; un conflicto aborta en rojo.
          for intento in 1 2 3; do
            if git push; then break; fi
            if [ "$intento" = 3 ]; then exit 1; fi
            git pull --rebase --autostash origin main || { git rebase --abort; echo "conflicto con main"; exit 1; }
          done
