name: Reloj de las pasadas

# El único reloj del bot (desde el 17/10/2026): cada ~15 min mira las ejecuciones de update.yml y, si toca,
# lanza una pasada (workflow_dispatch). Toca (scripts/reloj_pasadas.py) si ninguna está sin acabar y desde
# que empezó la última (su creación o, si se relanzó, su startedAt) han pasado 2 h (update_fiflp.PASS_EVERY,
# la cadencia base), o 1 h en las ventanas de partidos, hora de Canarias: viernes de 18 a 24 y sábado y
# domingo de 10 a 24 (una hora después de los primeros saques, que es cuando el bot ya busca resultados:
# update_fiflp.hot_reason); con 10 min de holgura.
# El cron de update.yml ('23 */2 * * *' desde el 16/10/2026) casi no llegaba: 5 de 13 en ~26 h, una pasada
# cada 4-6 h. Con un tick cada 15 min, uno perdido solo retrasa la pasada hasta el siguiente que llegue.
#
# ¿Por qué un workflow aparte y no un job «¿toca?» dentro de update.yml, con su cron cada 15 min? Porque
# cada ejecución de update.yml, aunque no haga nada, sube GITHUB_RUN_NUMBER, y de él sale el orden de cada
# pasada (update_fiflp.run_number: los turnos de ROTATION_PASSES, priority_slot, closed_turn y extras_turn):
# con ~90 ejecuciones vacías al día entre dos pasadas de verdad, el número saltaría de 4 en 4 o de 8 en 8 y
# la rotación sin estado dejaría turnos sin leer. Con el reloj aparte, el número de update.yml solo sube en
# pasadas de verdad (y en las que lanzan el carril del histórico al promover lo probado, historico.yml, y las
# tandas de actas que quedan al subir su raw, actas-federacion.yml; o a mano, como siempre; activar.yml no).
#
# El carril de las categorías mayores (infantil, cadete y juvenil; docs/categorias-mayores.md): carril-mayores.yml,
# que llama a update.yml con cats: infantil,cadete,juvenil, lo lanza también este reloj, y solo con la variable del
# repositorio CARRIL_MAYORES a 1 (apagado, sin ella: ni lista nada de más ni lanza). Toca (reloj_pasadas.due_carril)
# fuera de las ventanas y a más de 1 h de que empiece una, entre dos pasadas del bot (la última empezó hace 25-75
# min), cada 4 h, y nunca con otra ejecución sin acabar de update.yml, carril-mayores.yml, activar.yml o
# historico.yml (GitHub guarda una sola en espera por grupo de concurrencia: una más nueva cancelaría la que
# espera). Tiene su propio número de pasada (el de carril-mayores.yml): sus ejecuciones no están en la lista de
# update.yml y el reloj no las cuenta como pasadas del bot (si las contara, cada una retrasaría hasta 2 h la
# siguiente); con el carril encendido, la del bot solo espera a que acabe uno sin acabar (no haría cola tras él).
#
# El carril del histórico (historico.yml; docs/federacion.md, «El carril del histórico») también lo lanza este reloj,
# desde el 25/11/2026 y siempre (con o sin CARRIL_MAYORES): su cron ('47 */3 * * *') GitHub lo perdía como el de
# update.yml (ese día no llegaron ni el de las 18:47 ni el de las 21:47 UTC, y el carril se quedó parado hasta que se
# lanzó a mano). Toca (reloj_pasadas.due_historico) un intento cada 3 h desde que empezó la última del histórico (la
# lanzara quien la lanzara: el reloj, el propio carril al encadenarse, o a mano), fuera de las ventanas (en ellas no
# lee), y nunca con una ejecución sin acabar del histórico, de update.yml, carril-mayores.yml o activar.yml; ni en un
# tick en que se lanza la pasada del bot o la del carril. Va APARTE, en dos pasos al final y con continue-on-error:
# un fallo suyo (gh, una lista que no se entiende, GitHub que no deja lanzar) queda en el registro del paso y no
# tumba el reloj, que en rojo cada 15 min se miraría como un fallo del bot, ni le quita una pasada (las del bot y del
# carril ya se han decidido y lanzado antes). Para parar el histórico: -f accion=parar, o desactivar historico.yml;
# no el reloj (pararía también al bot).
#
# Ligero: checkout disperso de reloj_pasadas.py, el python3 del sistema, sin pip; y los permisos justos para
# leer y lanzar workflows (actions: write) y leer el repositorio (contents: read). Un fallo de gh o una
# respuesta que no se entiende al decidir la pasada del bot o la del carril: el job falla a la vista y no lanza nada
# (al decidir la del histórico, solo su paso: arriba). Sin la base de zonas horarias, un aviso y una pasada cada 2 h
# (sin ventanas), no un job en rojo; ni carril ni histórico (no se sabe dónde caen las ventanas).
#
# En un repositorio público GitHub DESACTIVA los workflows con schedule tras 60 días sin actividad (sin
# commits): este también, y entonces no hay pasadas (ni del carril ni del histórico) ni nada en rojo, solo deja de
# haber ejecuciones. En verano el bot casi no hace commits (del 28/7 al 9/9/2026, 43 días sin ninguno): al empezar
# la temporada, mirar que esté activo (gh workflow list --all: «disabled_inactivity») y reactivarlo con
# `gh workflow enable reloj.yml` o desde la pestaña Actions (docs/federacion.md, «El reloj de las pasadas»).
on:
  schedule:
    # Cada 15 min, a y 7, 22, 37 y 52: no a en punto ni a y media (GitHub retrasa o pierde más esos).
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

# Uno cada vez: dos ticks que GitHub entrega juntos se miran uno tras otro (el segundo ya ve la pasada que
# lanzó el primero, en cola o en marcha, y no lanza otra).
concurrency:
  group: reloj-pasadas
  cancel-in-progress: false

jobs:
  reloj:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout (solo el reloj)
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts/reloj_pasadas.py
          sparse-checkout-cone-mode: false

      # Con el carril encendido (CARRIL_MAYORES a 1, por env: nunca interpolada en el guion), también las ejecuciones
      # del carril, de la activación y del histórico; un fallo de cualquier lista tumba el paso sin decidir nada
      # (tampoco la pasada del bot: no se sabría si el carril está en marcha), y el tick siguiente lo vuelve a mirar.
      - name: ¿Toca una pasada?
        id: reloj
        env:
          GH_TOKEN: ${{ github.token }}
          CARRIL_MAYORES: ${{ vars.CARRIL_MAYORES }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow update.yml --limit 20 \
            --json number,event,status,conclusion,createdAt,startedAt > "$RUNNER_TEMP/pasadas.json"
          if [ "${CARRIL_MAYORES:-}" = 1 ]; then
            for wf in carril-mayores activar historico; do
              gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf.yml" --limit 20 \
                --json number,event,status,conclusion,createdAt,startedAt > "$RUNNER_TEMP/$wf.json"
            done
            python3 scripts/reloj_pasadas.py --carril "$RUNNER_TEMP/carril-mayores.json" \
              --activar "$RUNNER_TEMP/activar.json" --activar "$RUNNER_TEMP/historico.json" < "$RUNNER_TEMP/pasadas.json"
          else
            python3 scripts/reloj_pasadas.py < "$RUNNER_TEMP/pasadas.json"
          fi

      - name: Lanzar la pasada
        if: steps.reloj.outputs.due == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run update.yml --ref main --repo "$GITHUB_REPOSITORY"
          # Hasta que GitHub la enseñe (unos segundos), para que el tick siguiente, en fila tras este, la vea
          # en cola o en marcha. Si tarda más de un minuto, solo un aviso: ya está lanzada.
          for i in $(seq 12); do
            sleep 5
            busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow update.yml --limit 5 --json status \
              --jq '[.[] | select(.status != "completed")] | length' || echo 0)
            if [ "$busy" != "0" ]; then
              echo "Pasada lanzada: $busy sin acabar."
              exit 0
            fi
          done
          echo "::warning::La pasada está lanzada, pero GitHub aún no la enseña."

      # La pasada del carril de las mayores, solo si toca (due_carril: nunca a la vez que la del bot, y siempre
      # false con el carril apagado), sobre main, y como la del bot: hasta que GitHub la enseñe.
      - name: Lanzar el carril
        if: steps.reloj.outputs.due_carril == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run carril-mayores.yml --ref main --repo "$GITHUB_REPOSITORY"
          for i in $(seq 12); do
            sleep 5
            busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow carril-mayores.yml --limit 5 --json status \
              --jq '[.[] | select(.status != "completed")] | length' || echo 0)
            if [ "$busy" != "0" ]; then
              echo "Carril lanzado: $busy sin acabar."
              exit 0
            fi
          done
          echo "::warning::El carril está lanzado, pero GitHub aún no lo enseña."

      # El carril del histórico (reloj_pasadas.due_historico), solo si en este tick no se lanza ni la pasada del bot
      # ni la del carril, y con o sin CARRIL_MAYORES. Sus listas, en $RUNNER_TEMP/historico/ (no pisan las del paso
      # «¿Toca una pasada?»); la del bot es la que dejó ese paso. continue-on-error: un fallo aquí sale en rojo en el
      # paso, sin due_historico (no se lanza nada), y el job sigue en verde; el tick siguiente lo vuelve a mirar.
      - name: ¿Toca el histórico?
        id: historico
        if: steps.reloj.outputs.due != 'true' && steps.reloj.outputs.due_carril != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/historico"
          for wf in historico carril-mayores activar; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow "$wf.yml" --limit 20 \
              --json number,event,status,conclusion,createdAt,startedAt > "$RUNNER_TEMP/historico/$wf.json"
          done
          python3 scripts/reloj_pasadas.py --historico "$RUNNER_TEMP/historico/historico.json" \
            --otros "$RUNNER_TEMP/pasadas.json" --otros "$RUNNER_TEMP/historico/carril-mayores.json" \
            --otros "$RUNNER_TEMP/historico/activar.json"

      # Sin entradas (accion=seguir: lo pendiente del encargo), sobre main, y como los otros dos: hasta que GitHub lo
      # enseñe, para que el tick siguiente, en fila tras este, lo vea en cola o en marcha y no lance otro.
      - name: Lanzar el histórico
        if: steps.historico.outputs.due_historico == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run historico.yml --ref main --repo "$GITHUB_REPOSITORY"
          for i in $(seq 12); do
            sleep 5
            busy=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow historico.yml --limit 5 --json status \
              --jq '[.[] | select(.status != "completed")] | length' || echo 0)
            if [ "$busy" != "0" ]; then
              echo "Histórico lanzado: $busy sin acabar."
              exit 0
            fi
          done
          echo "::warning::El histórico está lanzado, pero GitHub aún no lo enseña."
