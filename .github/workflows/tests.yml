name: Tests

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**.py'
      - 'scripts/**.json'
      - 'scripts/**.sh'
      - 'scripts/requirements-*.txt'
      - 'scripts/tests/**'
      - 'scripts/empaquetar/**'
      - 'dist/**'
      - 'futbolbase.db'
      - 'base/**'
      - 'data-*.js'
      - 'src/**'
      - 'index.html'
      - 'acta.css'
      - 'sw.js'
      - 'manifest.json'
      - 'fonts/**'
      - 'icons/**'
      - 'escudos/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/update.yml'
      - '.github/workflows/reloj.yml'
      - '.github/workflows/activar.yml'
      - 'README.md'
      - 'docs/*.md'
      - 'docs/superpowers/specs/**'
      - 'pc/**'
  pull_request:
    paths:
      - 'scripts/**.py'
      - 'scripts/**.json'
      - 'scripts/**.sh'
      - 'scripts/requirements-*.txt'
      - 'scripts/tests/**'
      - 'scripts/empaquetar/**'
      - 'dist/**'
      - 'futbolbase.db'
      - 'base/**'
      - 'data-*.js'
      - 'src/**'
      - 'index.html'
      - 'acta.css'
      - 'sw.js'
      - 'manifest.json'
      - 'fonts/**'
      - 'icons/**'
      - 'escudos/**'
      - '.github/workflows/tests.yml'
      - '.github/workflows/update.yml'
      - '.github/workflows/reloj.yml'
      - '.github/workflows/activar.yml'
      - 'README.md'
      - 'docs/*.md'
      - 'docs/superpowers/specs/**'
      - 'pc/**'
  # Red de seguridad: los push del bot con GITHUB_TOKEN no disparan este
  # workflow (anti-recursión de GitHub), así que un cron diario garantiza
  # que las suites corren sobre main al menos una vez al día.
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:

# Las acciones, en la versión mayor más baja que corre en Node 24 (plan B4, decisiones 12 y 55; lo fija
# test_workflows.py): checkout@v5, setup-python@v6 y setup-node@v5, como update.yml; y la imagen,
# fijada en ubuntu-24.04, como en todos los workflows.
# Las suites, con esbuild (scripts/empaquetar, npm ci): las pruebas que empaquetan de verdad
# (test_empaquetar.py, test_publicar.py) se saltan sin él, como en el bot, que no lo instala.
jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install pytest
        run: pip install -r scripts/requirements-tests.txt
      # El fichero del bot se resuelve (versiones que existen y casan entre sí) sin instalar Playwright aquí.
      - name: Dependencias del bot instalables
        run: pip install --dry-run -r scripts/requirements-bot.txt
      # Antes de instalar esbuild, como las corre el bot (update.yml y activar.yml no lo instalan): las pruebas
      # que dependen de si hay esbuild (las que importan codigo o publicar, y las del precache).
      - name: Pruebas de publicación sin esbuild (como el bot)
        run: python3 -m pytest scripts/tests/test_publicar.py scripts/tests/test_empaquetar.py scripts/tests/test_precache.py scripts/tests/test_season_preparation.py scripts/tests/test_index_bot_contract.py -q
      - name: Install esbuild (empaquetado de dist/)
        run: npm ci --prefix scripts/empaquetar
      # PIEZAS_REAL: la base de verdad partida y vuelta a montar (test_piezas_real.py, sobre una copia; ~20 s).
      - name: Run Python tests
        env:
          PIEZAS_REAL: '1'
        run: python -m pytest scripts/tests/ -v
      # Parte D, fase 1 (docs/almacenamiento.md): el aviso diario de que la sombra se ha desviado. Las piezas que
      # subió la última pasada (base/), montadas, tienen que ser futbolbase.db fila a fila; si no, rojo aquí,
      # aunque el bot siga publicando. Hasta que la primera pasada con datos las suba no hay nada que comparar.
      - name: Las piezas son la base
        run: |
          if [ ! -f base/piezas.json ]; then
            echo "::warning::Todavía no hay piezas en base/: las sube la primera pasada del bot con datos."
            exit 0
          fi
          python3 scripts/piezas.py comparar --db futbolbase.db --piezas base
      # Qué se rehace desde los originales (scripts/reconstruir.py, docs/reconstruccion.md), sobre copias de la
      # base: minutos, por eso aquí aparte; la suite que pasa el bot en cada pasada la salta sin RECONSTRUIR.
      - name: Reconstrucción desde los originales
        env:
          RECONSTRUIR: '1'
        run: python3 -m pytest scripts/tests/test_reconstruir.py -q

  node-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install esbuild (empaquetado de dist/)
        run: npm ci --prefix scripts/empaquetar
      - name: Run Node tests
        # Glob (contrato C5): coge todas las suites test_*.mjs presentes y
        # futuras (render-smoke.mjs no matchea, corre en su propio job).
        run: node --test scripts/tests/test_*.mjs

  render-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.58.0
      - name: Render smoke (headless Chrome; the D state with Playwright)
        run: node scripts/tests/render-smoke.mjs
      - name: Interaction smoke (headless Chrome)
        run: node scripts/tests/interaction-smoke.mjs
      - name: PWA update and offline smoke
        run: node scripts/tests/pwa-smoke.mjs
      # Publica versiones nuevas sobre una copia con generate_js y precache.py: el python3 del sistema basta
      # (solo la biblioteca estándar); sin esbuild, porque una subida de datos no toca el código.
      - name: Frescura tras una subida de datos (headless Chrome, SW de verdad)
        run: node scripts/tests/frescura-smoke.mjs

  # v1 y v2 en el mismo origen, con sus SW de verdad: ninguna toca las cachés ni las claves de la otra,
  # tampoco al actualizarse. Saca v1 de su commit con git archive (y lo trae si el clon no lo tiene).
  aislamiento-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.58.0
      - name: v1 y v2 en el mismo origen (headless Chrome)
        run: node scripts/tests/aislamiento-smoke.mjs

  # Las herramientas del PC del dueño (la copia de seguridad y el reloj), cada una como dice su README: la de la
  # copia, desde su carpeta, que es la que hace importable su paquete.
  pc-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install -r scripts/requirements-tests.txt
      - name: Copia de seguridad del PC (pc/copia)
        working-directory: pc/copia
        run: python3 -m pytest tests -q -W error
      - name: Reloj del PC (pc/reloj)
        run: python3 -m pytest pc/reloj/tests -q -W error
