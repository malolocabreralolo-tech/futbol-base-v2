name: Discover FIFLP competitions

on:
  workflow_dispatch:

permissions:
  contents: write

# Las descargas manuales no se pisan entre sí; no hacen cola con el bot porque no escriben la base y rebasan antes de subir.
concurrency:
  group: descargas-manuales
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps
      - name: Discover competitions across all seasons
        run: python3 scripts/discover_fiflp_comps.py
        timeout-minutes: 10
      - name: Commit catalog
        run: |
          git config user.name  "GitHub Actions"
          git config user.email "actions@github.com"
          git add scripts/fiflp_comps_catalog.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "discover: FIFLP competitions catalog (all seasons)"
            # Como el bot (update.yml): si alguien ha subido a main entretanto, se rebasa y se reintenta; un
            # conflicto aborta en rojo.
            for intento in 1 2 3; do
              if git push; then break; fi
              if [ "$intento" = 3 ]; then exit 1; fi
              git pull --rebase --autostash origin main || { git rebase --abort; echo "conflicto con main"; exit 1; }
            done
          fi
