name: Actualización automática

# Las pasadas del bot: pasadas cortas (la federación bloquea más cada vez dentro de una pasada y cada
# ejecución tiene IP nueva: docs/federacion.md). Desde el 17/10/2026 no tiene cron: las lanza el reloj
# (reloj.yml, scripts/reloj_pasadas.py) cada 2 h (update_fiflp.PASS_EVERY) y cada hora en las ventanas de
# partidos (viernes de 18 a 24 y sábado y domingo de 10 a 24, hora de Canarias), nunca con otra sin acabar;
# también el carril del histórico (historico.yml) al promover lo que probó, las tandas de actas que quedan
# (actas-federacion.yml) al subir su raw, la propia pasada tras caer en un runner rechazado (al final, «Relanzar si
# el runner fue rechazado») y a mano; la activación (activar.yml), no. Su cron ('23 */2 * * *'
# desde el 16/10/2026; '0 */6 * * *' antes) casi no llegaba: 5 de 13 en ~26 h, una pasada cada 4-6 h. El reloj es otro workflow, y no un job «¿toca?» aquí,
# porque cada ejecución de update.yml, aunque no haga nada, sube GITHUB_RUN_NUMBER, del que sale el orden de
# cada pasada (update_fiflp.run_number): así solo sube en pasadas de verdad.
#
# El carril de las categorías mayores (infantil, cadete y juvenil; docs/categorias-mayores.md): este mismo
# workflow, llamado (workflow_call) desde carril-mayores.yml con cats: infantil,cadete,juvenil, que lanza el reloj
# entre dos pasadas del bot solo con la variable del repositorio CARRIL_MAYORES a 1. Llamado así, GITHUB_RUN_NUMBER
# es el de carril-mayores.yml (el contexto github es el del llamante): no gasta números del bot, del que sale su
# rotación sin estado, y sus ejecuciones no salen en la lista de update.yml que mira el reloj, que no las cuenta
# como pasadas del bot (si las contara, cada una retrasaría hasta 2 h la siguiente). La concurrencia va en el job
# y no en el workflow: con la misma en el llamante y en el llamado, GitHub lo daría por bloqueo mutuo; en el job
# vale igual para las dos formas de lanzarlo (mismo grupo update-data que activar.yml: una escritura de la base
# cada vez). Lanzado por el reloj, sin entradas, todo es como antes del carril.
on:
  workflow_dispatch:          # el reloj (reloj.yml), el carril del histórico, las tandas de actas, la propia pasada y a mano
    inputs:
      # Solo a mano, para una pasada pequeña (la primera de un repositorio nuevo): el reloj y el histórico no
      # la pasan y, vacía, se lee el carril principal (update_fiflp.update_groups: prebenjamín, benjamín y alevín).
      cats:
        description: 'Categorías a leer, separadas por comas (vacío: prebenjamín, benjamín y alevín)'
        required: false
        default: ''
        type: string
      # Los relanzamientos seguidos tras un runner rechazado («Relanzar si el runner fue rechazado», al final): lo
      # pone la propia pasada al relanzarse (uno más); el reloj y los demás lanzan sin él (0). Texto y no number: la
      # misma entrada viene de carril-mayores.yml, GitHub comprueba el tipo de lo que se pasa a una entrada de
      # workflow_call, y un número que llegara como texto tumbaría la llamada (la pasada del carril entera); el guion
      # del paso la comprueba (lo que no es un número no relanza).
      reintento:
        description: 'Relanzamientos seguidos tras un runner rechazado (lo pone la propia pasada; a mano, 0)'
        required: false
        default: '0'
        type: string
  workflow_call:              # carril-mayores.yml, con cats: infantil,cadete,juvenil (y su reintento)
    inputs:
      cats:
        description: 'Categorías a leer, separadas por comas (vacío: prebenjamín, benjamín y alevín)'
        required: false
        default: ''
        type: string
      reintento:
        description: 'Relanzamientos seguidos tras un runner rechazado (lo pone la propia pasada; a mano, 0)'
        required: false
        default: '0'
        type: string

# actions: write, desde la fase 2D (14/11/2026), solo para lanzar activar.yml («Lanzar la activación si hay
# algo nuevo») y, desde el 26/11/2026, para relanzar la pasada tras un runner rechazado («Relanzar si el runner fue
# rechazado»). Llamado desde carril-mayores.yml, el llamante le da los mismos (no puede pedir más que él).
permissions:
  contents: write
  actions: write

jobs:
  update:
    # Una pasada cada vez, del bot o del carril, y en fila con activar.yml, sin cancelar la que corre: el grupo
    # update-data, en el job (arriba, por qué no en el workflow).
    concurrency:
      group: update-data
      cancel-in-progress: false
    # Las categorías de la pasada (la entrada cats; vacía, el carril principal), para TODOS los pasos: el bot
    # (update_fiflp.update_groups) y también source_health.py marcar y veredicto, que eligen por ella el carril
    # cuyo informe tocan (runHealth o carriles.mayores), y el asunto del commit.
    env:
      FIFLP_CATS: ${{ inputs.cats }}
    # La imagen fijada y las acciones en Node 24, como tests.yml (plan B4, decisión 55; test_workflows.py).
    runs-on: ubuntu-24.04
    # 40: los grupos de la federación se leen con navegador (~7 s por página, fiflp_carga.py) y la
    # federación sirve ~15 páginas por IP antes de frenar, cada vez más (~5 min, ~15 y más; pasadas
    # 1107-1110). Cada pasada espera solo el primer freno y acaba en el segundo (~9 min); su plazo global
    # es de 16 min para una pasada sin freno (update_fiflp.DEADLINE_SECONDS; la espera del freno cabe
    # dentro, y ninguna página empieza después), más preparación, app, importaciones, generate_js, pruebas y
    # commit. Eso se contaba en 4-8 min, pero solo las pruebas ya pasan de ahí: en el PC, el 26/11, ~13 min la
    # de Python con la base de hoy y ~1 min la de Node, y desde el paso D3 algo más (docs/categorias-mayores.md);
    # en el runner, sin medir. Hasta el 16/10/2026, 55 (33 min de plazo).
    timeout-minutes: 40

    steps:
      # ref: main, el main de AHORA: un workflow_dispatch en cola (el carril del histórico lanza el bot)
      # trabaja por defecto sobre el commit del momento en que se lanzó, y al arrancar tras otra pasada
      # se pisaba con la base que ella subió (4/10/2026: conflicto en futbolbase.db).
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # El Node de las pruebas, fijado como en tests.yml (no el que traiga la imagen del runner).
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Instalar dependencias de test
        run: pip install -r scripts/requirements-tests.txt

      # Desde 2026/27 los grupos vienen de la federación (FIFLP), que solo
      # responde a un navegador y no a IPs domésticas: update_fiflp.py.
      - name: Instalar Playwright (grupos de la federación)
        run: |
          pip install -r scripts/requirements-bot.txt
          playwright install chromium --with-deps

      # Diagnóstico del freno de la federación (15/10/2026): la IP pública del runner, que cambia de una
      # ejecución a otra, para cruzar los frenos del log (esperas del freno, «no sirve páginas») con las IPs.
      # Solo en el log (no va a data-health.json), sin secretos ni datos del usuario, y nunca para el job:
      # 5 s como mucho y, sin respuesta, «desconocida». Y la nube (25/11/2026): el fabricante de la máquina
      # («Microsoft Corporation» en Azure, «Amazon EC2» en AWS), porque la federación no sirve a los runners
      # de AWS desde el 13/11/2026 (docs/freno-2026-11.md); el bot lo lee igual (fiflp_carga.nube, run.cloud).
      - name: IP pública del runner
        continue-on-error: true
        timeout-minutes: 1
        run: |
          echo "IP pública del runner: $(curl -s --max-time 5 https://api.ipify.org || echo desconocida)"
          echo "Nube del runner: $(cat /sys/class/dmi/id/sys_vendor 2>/dev/null || echo desconocida)"

      # Parte D, fase 2 (docs/almacenamiento.md): la base de la pasada sale de sus piezas (base/). futbolbase.db
      # sigue en git, idéntica a ellas (las dos se suben juntas): --contra para la pasada si no lo es, porque
      # entonces alguien ha subido solo una de las dos y hay que decidir a mano cuál vale. Justo antes del bot, el
      # primero que la lee, y no antes: si falla, lo de arriba (la IP y la nube del runner) ya está en el log, y
      # el diagnóstico y «Relanzar si el runner fue rechazado» (abajo) corren igual (no la leen). 5 min de plazo
      # (hoy, ~11 s con la comparación): colgado, el job se cancelaría y no saldría ni el diagnóstico.
      - name: Montar la base
        id: montar
        timeout-minutes: 5
        run: python3 scripts/piezas.py montar --contra futbolbase.db

      - name: Actualizar datos desde futbolaspalmas.com y la federación
        id: scrape
        continue-on-error: true
        env:
          FIFLP_UPDATE: '1'
          # Sin búfer: cada línea del log con su hora (el coste de cada grupo de la federación).
          PYTHONUNBUFFERED: '1'
          # update_fiflp deja aquí una marca cuando cambia en la base estado suyo que no se publica
          # (la primera pasada completa de un grupo recién activado): el commit sube la base también entonces.
          FIFLP_DB_MARK: ${{ runner.temp }}/base-cambiada
        run: python3 scripts/fetch_futbolaspalmas.py

      # La base que se va a subir, entera (integridad, referencias, el WAL volcado al fichero, que es lo único
      # que sube git, y el tamaño: GitHub no admite ficheros de 100 MB): si no, ni pruebas ni commit, y el
      # diagnóstico lo publica. Con la base bien, su tamaño desde 80 MB va a data-health.json (`base`).
      - name: Base sana (bloquea el commit si falla)
        id: base
        if: steps.scrape.outcome == 'success'
        run: python3 scripts/base_sana.py --salud

      # Parte D, fase 2 (docs/almacenamiento.md): la base de esta pasada, partida en sus piezas (base/), y las
      # piezas vueltas a montar comprobadas contra ella. Mandan las piezas: si no salen iguales, ni suites ni
      # subida (ni la base ni las piezas), y el diagnóstico lo publica. 5 min de plazo (hoy, ~15 s; con todas las actas,
      # ~1,5 min).
      - name: Partir la base y comprobarla (bloquea el commit si falla)
        id: piezas
        if: steps.base.outcome == 'success'
        timeout-minutes: 5
        run: python3 scripts/piezas.py partir && python3 scripts/piezas.py verificar

      # Los push del bot (GITHUB_TOKEN) NO disparan tests.yml (anti-recursión
      # de GitHub), así que las suites tienen que correr AQUÍ, sobre los datos
      # recién generados y ANTES del commit: si fallan, el job sale rojo y no
      # se publica nada.
      - name: Tests Python (bloquean el commit si fallan)
        id: pytest
        if: steps.piezas.outcome == 'success'
        run: python3 -m pytest scripts/tests/ -q

      - name: Tests Node (bloquean el commit si fallan)
        id: node
        if: steps.piezas.outcome == 'success'
        run: node --test scripts/tests/test_*.mjs

      - name: Commit y push si hay cambios
        if: success() && steps.scrape.outcome == 'success'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          # generate_js.py escribe data-*.js (incl. data-seasons.js y
          # data-season-*.js), bumpea ?v= en index.html y CACHE_NAME en sw.js.
          # futbolbase.db cambia de bytes (cabecera SQLite) en CADA run aunque
          # no cambie ningún dato publicado: se gatea su commit a que cambie
          # algún artefacto publicado (evita ~13/14 commits de ruido), o a la
          # marca de update_fiflp (FIFLP_DB_MARK, en el paso scrape).
          git add 'data-*.js' index.html sw.js
          if ! git diff --cached --quiet || [ -f "$RUNNER_TEMP/base-cambiada" ]; then
            git add futbolbase.db
            # Sus piezas (base/), siempre con ella: la pasada siguiente las monta y exige que sean la misma base.
            git add -A base/
            # El raw de la app de futbolaspalmas (qué días ya están leídos) va con los datos que ha dado.
            git add 'scripts/fp_app_*_raw.json' 2>/dev/null || true
          fi
          # La comprobación de fuentes se publica aunque el marcador no cambie.
          git add data-health.json
          # Los originales de las actas que lee el bot (actas_bot.py, desde la fase 2C), también: una
          # relectura de las ya importadas no cambia nada publicado, pero su original hay que subirlo. Sin
          # ninguno todavía, el patrón no casa con nada: no es un error.
          git add 'scripts/actas_bot_*.jsonl' 2>/dev/null || true
          if ! git diff --cached --quiet; then
            # El del carril de las mayores dice sus categorías (FIFLP_CATS, del env del job): se distinguen en git log.
            if [ -n "${FIFLP_CATS:-}" ]; then ASUNTO="Actualización automática ($FIFLP_CATS)"; else ASUNTO="Actualización automática"; fi
            git commit -m "$ASUNTO $(date '+%d/%m/%Y %H:%M UTC')"
            # El run dura hasta ~25 min: si alguien ha empujado a main
            # mientras tanto (una tanda de la federación sube su raw), se
            # rebasa y se reintenta. Dos pasadas seguidas no se pisan: la
            # concurrency update-data las pone en fila y cada una parte del
            # main de cuando arranca (checkout ref: main). Un conflicto (la
            # base tocada en los dos lados) aborta en rojo; la pasada
            # siguiente (1-2 h después: reloj.yml) lo rehace.
            for intento in 1 2 3; do
              if git push; then break; fi
              if [ "$intento" = 3 ]; then exit 1; fi
              # --autostash: la importación de actas deja cambios sin subir (fiflp_actas_unmatched.json)
              # y sin él git se niega a rebasar (4/10/2026: «You have unstaged changes»).
              git pull --rebase --autostash origin main || { git rebase --abort; echo "conflicto con main: se rehará en la próxima pasada"; exit 1; }
            done
          fi

      # Si no se pudo montar la base, o falló el bot, la base, sus piezas o una de las suites (no si solo falló el
      # push de los datos: un conflicto se rehace en la pasada siguiente), se publica el diagnóstico, y nada más:
      # solo data-health.json. Hasta la fase 2B (14/11/2026), con las pruebas en rojo se perdía también el
      # diagnóstico.
      - name: Publicar diagnóstico si la fuente o las pruebas fallan
        if: ${{ !cancelled() && (steps.montar.outcome == 'failure' || steps.scrape.outcome == 'failure' || steps.pytest.outcome == 'failure' || steps.node.outcome == 'failure' || steps.base.outcome == 'failure' || steps.piezas.outcome == 'failure') }}
        env:
          MONTAR_OUTCOME: ${{ steps.montar.outcome }}
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
          BASE_OUTCOME: ${{ steps.base.outcome }}
          PIEZAS_OUTCOME: ${{ steps.piezas.outcome }}
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          if [ "$MONTAR_OUTCOME" = failure ]; then
            # Sin base montada no se ha hecho nada: el informe publicado, en rojo (el log de «Montar la base»
            # dice por qué: piezas rotas, o futbolbase.db y base/ que no son la misma base).
            git checkout HEAD -- data-health.json
            python3 scripts/source_health.py marcar "no se pudo montar la base desde sus piezas: esta pasada no se ha hecho"
          elif [ "$SCRAPE_OUTCOME" = success ]; then
            # Fallaron la base, sus piezas o las pruebas: los datos de esta pasada no se publican, y su informe
            # daría por leído lo que no se publica (como finish(failed=True)): se parte del publicado y se marca
            # en rojo.
            git checkout HEAD -- data-health.json
            if [ "$BASE_OUTCOME" = failure ]; then
              python3 scripts/source_health.py marcar "la base de datos no pasó la comprobación: los datos de esta pasada no se publicaron"
            elif [ "$PIEZAS_OUTCOME" = failure ]; then
              python3 scripts/source_health.py marcar "las piezas de la base no salieron iguales a la base: los datos de esta pasada no se publicaron"
            else
              python3 scripts/source_health.py marcar "las pruebas fallaron: los datos de esta pasada no se publicaron"
            fi
          fi
          # Falló el bot: no se publican datos deportivos parciales de una ejecución fallida, ni sus
          # comprobaciones correctas (source_health.finish(failed=True)): solo sus errores.
          git add data-health.json
          if ! git diff --cached --quiet; then
            git commit -m "Estado de las fuentes $(date '+%d/%m/%Y %H:%M UTC')"
            # Como el commit de datos: si main se ha movido (otra subida en el rato del bot), se rebasa y
            # se reintenta; un conflicto se deja para la pasada siguiente (1-2 h después: reloj.yml).
            for intento in 1 2 3; do
              if git push; then break; fi
              if [ "$intento" = 3 ]; then break; fi
              git pull --rebase --autostash origin main || { git rebase --abort; echo "conflicto con main: se rehará en la próxima pasada"; break; }
            done
          fi
          exit 1

      # Fase 2D (14/11/2026): si hay competiciones o grupos nuevos (newCompetitions, newGroups) y toca
      # (source_health.py pendiente: lo nuevo, ya; una descarga a medias, otro intento, hasta 8; lo que no se
      # arregla solo, una vez al día), lanza activar.yml sobre main; arranca en fila tras esta pasada
      # (concurrency update-data), y así pasadas e intentos se alternan. Un fallo al lanzarlo no pone la pasada
      # en rojo: la pasada siguiente lo vuelve a mirar. Solo el carril principal (sin cats): el de las mayores no
      # busca competiciones nuevas (sus extras son solo el directorio), y lo que hubiera pendiente lo lanza la
      # pasada siguiente del bot (una activación más en cola en update-data cancelaría la que espera).
      - name: Lanzar la activación si hay algo nuevo
        if: success() && inputs.cats == ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if IDS=$(python3 scripts/source_health.py pendiente); then
            echo "Pendiente de activar: $IDS"
            gh workflow run activar.yml -R malolocabreralolo-tech/futbol-base-v2 --ref main
          else
            echo "Nada nuevo que activar."
          fi

      # El veredicto de la pasada (runHealth, update_fiflp y source_health.set_run_health) pone el job en rojo,
      # después del commit: los datos de los grupos leídos bien ya están publicados. Si algo anterior falló,
      # el job ya está en rojo.
      - name: Pasada en rojo
        if: success()
        run: python3 scripts/source_health.py veredicto

      # Decisión del dueño del 26/11/2026: si ESTA pasada cayó en un runner que la federación no sirve (AWS, desde el
      # 13/11/2026: «runner rechazado», fiflp_carga.Federacion.refused_runner; no le pide nada más tras la primera
      # página vacía y no es un freno), se lanza otra en seguida, hasta 3 seguidas (TOPE): nunca un bucle si un día la
      # federación no sirve a nadie. El contador es la entrada reintento (la relanzada la recibe con uno más; el
      # reloj y los demás lanzan sin ella: 0). El último paso, con !cancelled() y continue-on-error: lo demás ya ha
      # corrido (lo leído, publicado), y un fallo suyo no pone la pasada en rojo.
      #   - Solo si el job iba bien (PASADA, job.status: un fallo de otra cosa no se arregla relanzando, lo retoma el
      #     reloj) y si la nota de la pasada de su carril en el data-health.json del espacio de trabajo es la de ESTA
      #     ejecución y dice refusedRunner (source_health.py rechazado, con GITHUB_RUN_NUMBER, que imprime el carril:
      #     una nota de otra pasada, o ninguna, es «no se sabe», y no se relanza). Una pasada rechazada siempre escribe
      #     su nota en el fichero (source_health.finish).
      #   - El carril de las mayores relanza carril-mayores.yml (su número de pasada es el de él), nunca update.yml;
      #     una pasada a mano del carril principal con cats no se relanza (sería otra pasada que la que se pidió).
      #   - La concurrencia: la relanzada queda en cola en update-data tras este job, que está acabando, y GitHub guarda
      #     UNA sola en espera por grupo (una más nueva cancela la que esperaba). Si esta pasada acaba de lanzar
      #     activar.yml (el paso de la activación corre con todo en verde y, en el carril principal, con algo pendiente
      #     del informe de antes: source_health.py pendiente, el mismo fichero), la relanzada la cancelaría (o al
      #     revés): entonces no se relanza, y la pasada la retoma el reloj, como hasta ahora.
      #   - El reloj (reloj_pasadas.due): mientras la relanzada está en cola o en marcha no lanza otra pasada (una
      #     ejecución de update.yml sin acabar; la del carril de las mayores, con CARRIL_MAYORES a 1), y la relanzada es
      #     «la última pasada» para su cadencia: la siguiente, 1-2 h después de que empiece ella.
      #   - GITHUB_RUN_NUMBER sube con cada relanzada (en el carril de las mayores, el de carril-mayores.yml), y de él
      #     sale la rotación del bot (update_fiflp.run_number): es aceptable, porque la rechazada ya gastaba su número
      #     sin leer su turno (igual que antes de relanzar), y la relanzada lee el turno siguiente en vez de esperar 2 h;
      #     el turno perdido vuelve al dar la vuelta, como el de cualquier pasada perdida (plan_groups lleva margen
      #     para números que se saltan).
      # Si GitHub no deja crear el disparo (un HTTP 500, como el 25/11/2026 en el histórico), otro intento a los 20 s;
      # si tampoco, el paso en rojo y la pasada en verde: lo retoma el reloj.
      - name: Relanzar si el runner fue rechazado
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          REINTENTO: ${{ inputs.reintento }}
          PASADA: ${{ job.status }}
        run: |
          TOPE=3
          if [ "$PASADA" != success ]; then
            echo "La pasada no acabó bien ($PASADA): no se relanza; la retoma el reloj."
            exit 0
          fi
          if ! CARRIL=$(python3 scripts/source_health.py rechazado "$GITHUB_RUN_NUMBER"); then
            echo "No se relanza."
            exit 0
          fi
          REINTENTO=${REINTENTO:-0}
          case "$REINTENTO" in
            *[!0-9]*) echo "reintento no es un número ($REINTENTO): no se relanza."; exit 0 ;;
          esac
          if [ "$REINTENTO" -ge "$TOPE" ]; then
            echo "Runner rechazado otra vez, tras $REINTENTO relanzamientos seguidos: no se relanza más; la retoma el reloj."
            exit 0
          fi
          SIGUIENTE=$((REINTENTO + 1))
          if [ "$CARRIL" = mayores ]; then
            echo "Runner rechazado: se relanza el carril de las mayores (relanzamiento $SIGUIENTE de $TOPE)."
            gh workflow run carril-mayores.yml -R malolocabreralolo-tech/futbol-base-v2 --ref main -f reintento="$SIGUIENTE" \
              || { sleep 20; gh workflow run carril-mayores.yml -R malolocabreralolo-tech/futbol-base-v2 --ref main -f reintento="$SIGUIENTE"; }
            exit 0
          fi
          if [ -n "${FIFLP_CATS:-}" ]; then
            echo "Una pasada a mano con cats ($FIFLP_CATS): no se relanza."
            exit 0
          fi
          if python3 scripts/source_health.py pendiente > /dev/null; then
            echo "Esta pasada ha lanzado la activación (activar.yml): la relanzada la cancelaría en la cola de update-data. No se relanza; la retoma el reloj."
            exit 0
          fi
          echo "Runner rechazado: se relanza la pasada (relanzamiento $SIGUIENTE de $TOPE)."
          gh workflow run update.yml -R malolocabreralolo-tech/futbol-base-v2 --ref main -f reintento="$SIGUIENTE" \
            || { sleep 20; gh workflow run update.yml -R malolocabreralolo-tech/futbol-base-v2 --ref main -f reintento="$SIGUIENTE"; }
