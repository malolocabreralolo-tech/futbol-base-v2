  <!-- Datos inmediatos: los siete que lee la portada. Con defer se ejecutan en este orden al terminar
       el análisis, y el módulo del arranque, detrás: sus globales ya están cuando arranca app.js. -->
  <script defer src="./data-benjamin.js?v=20261119"></script>
  <script defer src="./data-prebenjamin.js?v=20261119"></script>

  <script type="module">
    // El código, de dist/ (con la huella de su contenido en el nombre: nunca una versión mezclada con otra).
    // Si el arranque falla (sin conexión, con una página nueva de la red cuyo paquete todavía no está
    // guardado, o un módulo que no llega), un aviso con estilos en línea y «Reintentar»: nunca «Cargando…»
    // para siempre. Es texto fijo, sin datos.
    (async () => {
      try {
        const { start } = await import('./dist/app-64f418c9.js');
        start(document, window);
      } catch (error) {
        console.error('[arranque]', error);
        document.getElementById('contenido').innerHTML = `<div role="alert" style="max-width:40rem;margin:0 auto;padding:24px 16px;font:16px/1.5 system-ui,sans-serif">
          <p style="margin:0 0 16px">No se pudo abrir la versión nueva de la app. Comprueba la conexión y pulsa Reintentar.</p>
          <button type="button" id="reintentar-arranque" style="min-height:44px;padding:0 20px;border:0;border-radius:0;background:#C0182B;color:#FFFFFF;font:inherit;font-weight:700">Reintentar</button>
        </div>`;
        document.getElementById('reintentar-arranque').addEventListener('click', async () => {
          // Que el navegador busque ya el SW nuevo (sin esperarlo más de 3 s) y otra vez desde el principio.
          try {
            const registration = await navigator.serviceWorker?.getRegistration();
            if (registration) await Promise.race([registration.update(), new Promise((resolve) => setTimeout(resolve, 3000))]);
          } catch { /* sin SW o sin red: se recarga igual */ }
          location.reload();
        });
      }
    })();
  </script>
  <script>
    // El registro del SW, tras load: en la primera visita su instalación compite con los datos y el código de
    // la portada. register y update() en cada apertura (nunca unregister: reinstalaría todo cada vez); sw.js
    // toma el mando en seguida (skipWaiting y clients.claim).
    if ('serviceWorker' in navigator) {
      const register = () => navigator.serviceWorker.register('./sw.js')
        .then(reg => reg.update())
        .catch(() => {});
      if (document.readyState === 'complete') register();
      else addEventListener('load', register, { once: true });
    }
  </script>
